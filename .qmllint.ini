# qmllint configuration — see `qmllint --help` (Qt 6.5+).
# Project ships singleton QML modules under TodoCpp; the importer wires those
# up via qt_add_qml_module(), so qmllint must trust them.

[General]
DisableDefaultImports=false
AdditionalQmlImportPaths=

[Warnings]
# Errors — must be fixed.
SyntaxErrors=error
TypeErrors=error
ImportFailures=error

# Warnings — surface to CI / IDE but do not block by default.
DeferredPropertyId=warning
RequiredProperty=warning
UnqualifiedAccess=warning
UnusedImports=warning
WithStatement=warning
PropertyLessObject=warning
ReadOnlyProperty=warning
TypeSafe=warning

# Quieted — known false positives or intentional patterns.
PluginsMissing=disable
InheritanceCycle=disable
