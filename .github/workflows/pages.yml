name: Site

# The website lives in site/ (Astro, GSAP, Lenis; ru + en) and is published to
# GitHub Pages. Besides its own files it reads the newest state fixture and the
# schema version (tests/fixtures/state, src/StateSerializer.h) for the state.json
# example, the Scoop bucket (bucket/) to decide whether to offer Scoop, and
# release data from the GitHub API at build time — so it rebuilds when any of
# those change and after the Release workflow finishes (the download sizes follow
# each release). That hook is workflow_run, not `release: published`: the release
# is created with GITHUB_TOKEN, which never triggers other workflows, and a
# workflow_run build runs on master — the only branch the github-pages
# environment deploys from. Pull requests build and test without deploying.

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'tests/fixtures/state/**'
      - 'src/StateSerializer.h'
      - 'bucket/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'tests/fixtures/state/**'
      - 'src/StateSerializer.h'
      - 'bucket/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time and never cancel one in flight; a newer push to the
# same pull request cancels the older check.
concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: build & test
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          # Read-only token for the releases API; avoids the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload the site as the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Write Pages, mint the OIDC token deploy-pages needs; `deployments: write`
    # lets the prune step delete the stale github-pages deployment records each
    # publish leaves behind.
    permissions:
      pages: write
      id-token: write
      deployments: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # enablement: true flips the repo Pages source to GitHub Actions on first
      # run, so no manual Settings → Pages toggle.
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # Every publish mints a new github-pages deployment record; only the newest
      # is live. Left alone they pile up in the Environments view. Keep just the
      # deployment we published above and delete the rest — set each inactive
      # first (required before an active deployment can be deleted), then remove
      # it. Live site is unaffected.
      - name: Prune stale Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          keep=$(gh api "repos/$REPO/deployments?environment=github-pages&per_page=1" --jq '.[0].id')
          echo "keeping current deployment: $keep"
          gh api --paginate "repos/$REPO/deployments?environment=github-pages&per_page=100" --jq '.[].id' \
            | grep -vx "$keep" \
            | while read -r id; do
                gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=inactive >/dev/null 2>&1 || true
                gh api -X DELETE "repos/$REPO/deployments/$id" >/dev/null 2>&1 \
                  && echo "pruned deployment $id" \
                  || echo "skip (undeletable) $id"
              done
