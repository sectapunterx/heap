name: Deploy Pages

# The single-page site + brandbook live under docs/ and are hand-written static
# HTML/CSS/JS (no Jekyll — see docs/.nojekyll). The legacy Jekyll Pages builder
# errored opaquely and left the site stale, so publish via GitHub Actions
# instead: reliable, with real build logs.

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least privilege for the deploy: read the repo, write Pages, mint the OIDC
# token deploy-pages needs. `deployments: write` lets the prune step delete the
# stale github-pages deployment records each publish leaves behind.
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

# One deploy at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # enablement: true flips the repo Pages source from the legacy builder to
      # GitHub Actions on first run, so no manual Settings → Pages toggle.
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Every publish mints a new github-pages deployment record; only the newest
      # is live. Left alone they pile up in the Environments view (one per docs
      # push). Keep just the deployment we published above and delete the rest —
      # set each inactive first (required before an active deployment can be
      # deleted), then remove it. Live site is unaffected.
      - name: Prune stale Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          keep=$(gh api "repos/$REPO/deployments?environment=github-pages&per_page=1" --jq '.[0].id')
          echo "keeping current deployment: $keep"
          gh api --paginate "repos/$REPO/deployments?environment=github-pages&per_page=100" --jq '.[].id' \
            | grep -vx "$keep" \
            | while read -r id; do
                gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=inactive >/dev/null 2>&1 || true
                gh api -X DELETE "repos/$REPO/deployments/$id" >/dev/null 2>&1 \
                  && echo "pruned deployment $id" \
                  || echo "skip (undeletable) $id"
              done
