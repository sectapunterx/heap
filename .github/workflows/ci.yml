name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: ["**"]

permissions:
  # `contents: write` is needed by the auto-format/auto-tidy jobs that push
  # corrections back to the PR branch via stefanzweifel/git-auto-commit-action.
  contents: write
  # dorny/test-reporter posts a Check Run with test details on PRs.
  # Private repos need explicit grants — defaulting GITHUB_TOKEN to read-only
  # breaks the action with HTTP 403 "Resource not accessible by integration".
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:

  # ──────────────────────────────────────────────────────────────────
  # 0. Does this change need a build at all?
  # A PR that touches only docs/ or Markdown skips build, sanitizers and the
  # macOS package smoke test; `ci` counts a skipped job as passed. Pushes
  # (master, develop) always build everything. Not `paths-ignore` on the
  # trigger: then no `ci` check would report and the PR could not merge.
  # ──────────────────────────────────────────────────────────────────
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      # On pull_request the filter reads the file list from the API — no
      # checkout needed.
      - name: Classify changed files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          # `every`: a file counts as code only if it matches all patterns,
          # i.e. it is neither under docs/ nor Markdown.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  # ──────────────────────────────────────────────────────────────────
  # 1. C++ auto-format (PR only).
  # Runs `clang-format -i` on the files touched by the PR and pushes the
  # result back to the branch. Idempotent — a second run after a successful
  # format produces no diff and the auto-commit step no-ops, so the workflow
  # does not loop.
  # ──────────────────────────────────────────────────────────────────
  format-cpp:
    name: clang-format (auto-fix)
    # Auto-commit only works when the workflow can push to the head branch —
    # forks have a read-only token. Skip on fork PRs (they get reviewed
    # manually).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Apply clang-format to changed files
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/changed_files.sh
          mapfile -t files < <(.github/scripts/changed_files.sh 'cpp|cc|cxx|h|hpp|hxx')
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No C/C++ changes — skipping."
            exit 0
          fi
          echo "Reformatting: ${files[*]}"
          clang-format -i --style=file "${files[@]}"

      - name: Commit formatting
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: apply clang-format"
          commit_user_name: heap-ci
          commit_user_email: heap-ci@users.noreply.github.com
          # Only extensions actually present in the repo — git-auto-commit
          # invokes `git add` with raw globs and fails on any pattern that
          # matches nothing (`fatal: pathspec '*.cc' did not match any files`).
          file_pattern: "*.cpp *.h"

  # ──────────────────────────────────────────────────────────────────
  # 2. QML lint — DISABLED.
  #
  # qmllint needs the `qmldir` and `.qmltypes` files emitted by Qt's
  # `qt_add_qml_module(... URI TodoCpp ...)` at build time to resolve the
  # project's singletons (Theme, Brand, AppController). Running it
  # without a full build produces hundreds of false-positive "Property X
  # not found on type Theme" / "Unqualified access settingsBus" warnings.
  #
  # To re-enable: gate the job on a prior `build (ubuntu-24.04)` artifact
  # and point qmllint at the generated `<build>/qml/TodoCpp/qmldir` via
  # `-I <build-dir>`. Left as a follow-up.
  # ──────────────────────────────────────────────────────────────────
  # lint-qml:
  #   name: qmllint
  #   runs-on: ubuntu-24.04
  #   timeout-minutes: 10
  #   steps:
  #     - uses: actions/checkout@v7
  #       with: { fetch-depth: 0 }
  #     - name: Install Qt6 declarative tools
  #       run: |
  #         sudo apt-get update
  #         sudo apt-get install -y --no-install-recommends \
  #           qt6-declarative-dev qt6-declarative-dev-tools
  #     - name: qmllint changed files
  #       env: { GITHUB_BASE_REF: ${{ github.base_ref }} }
  #       run: |
  #         set -euo pipefail
  #         chmod +x .github/scripts/changed_files.sh
  #         mapfile -t files < <(.github/scripts/changed_files.sh 'qml')
  #         [[ ${#files[@]} -eq 0 ]] && exit 0
  #         qmllint_bin="$(command -v qmllint \
  #           || ls /usr/lib/qt6/bin/qmllint /usr/lib/qt6/libexec/qmllint \
  #               /usr/lib/x86_64-linux-gnu/qt6/bin/qmllint 2>/dev/null | head -1)"
  #         [[ -z "$qmllint_bin" ]] && { echo "::warning::qmllint missing"; exit 0; }
  #         "$qmllint_bin" -I qml "${files[@]}"

  # ──────────────────────────────────────────────────────────────────
  # 3. GitHub Actions YAML lint (full sweep — fast).
  # ──────────────────────────────────────────────────────────────────
  lint-actions:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2
        with:
          files: ".github/workflows/*.yml"

  # ──────────────────────────────────────────────────────────────────
  # 4. clang-tidy auto-fix (PR only).
  # Applies auto-fixable diagnostics (modernize-*, readability-*, …) and
  # pushes the result back to the PR branch. Non-auto-fixable findings are
  # left as warnings — the job does not fail on those, so reviewers can
  # see them inline without blocking merges.
  # ──────────────────────────────────────────────────────────────────
  tidy:
    name: clang-tidy (auto-fix)
    # Serialize after format-cpp so the auto-commit chain stays linear —
    # otherwise the two jobs race and the second push is rejected as
    # non-fast-forward when the first one lands on origin first.
    needs: format-cpp
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-tidy clang-format cmake ninja-build \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev qt6-networkauth-dev libgl1-mesa-dev

      - name: Configure (compile_commands.json)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DHEAP_BUILD_TESTS=OFF

      - name: Build Qt-generated sources only
        # AUTOMOC / qmltyperegistrations files only exist after a partial
        # build; clang-tidy fails to find them otherwise.
        run: cmake --build build --target heap_autogen heap_qmltyperegistrations || true

      - name: Apply clang-tidy --fix to changed files
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/changed_files.sh
          mapfile -t files < <(.github/scripts/changed_files.sh 'cpp|cc|cxx')
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No C/C++ source changes — skipping clang-tidy."
            exit 0
          fi
          tidy_files=()
          for f in "${files[@]}"; do
            if grep -q "\"file\": *\"$(pwd)/$f\"" build/compile_commands.json; then
              tidy_files+=("$f")
            fi
          done
          if [[ ${#tidy_files[@]} -eq 0 ]]; then
            echo "No source files with compile-commands entries — skipping."
            exit 0
          fi
          echo "clang-tidy --fix on: ${tidy_files[*]}"
          # `--fix-errors` applies every available rewrite even when other
          # diagnostics are non-fatal; `--quiet` keeps the log readable.
          # Identifier-naming auto-fixes would rename hundreds of legacy
          # symbols in one commit — opt out of those here; the warnings are
          # still visible inline in the PR.
          clang-tidy --fix --fix-errors --quiet \
            --checks='-readability-identifier-naming' \
            -p build "${tidy_files[@]}" || true

      - name: Commit clang-tidy fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: apply clang-tidy auto-fixes"
          commit_user_name: heap-ci
          commit_user_email: heap-ci@users.noreply.github.com
          # Only extensions actually present in the repo — git-auto-commit
          # invokes `git add` with raw globs and fails on any pattern that
          # matches nothing (`fatal: pathspec '*.cc' did not match any files`).
          file_pattern: "*.cpp *.h"

  # ──────────────────────────────────────────────────────────────────
  # 5. Build + test matrix (Linux, Windows, macOS).
  # ──────────────────────────────────────────────────────────────────
  build:
    name: build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    steps:
      # Real-time scanning inspects every object file, header and DLL the build
      # touches. The runner is thrown away after the job, so skip the scan for
      # the checkout and for runner.temp, where setup-msys2 installs MSYS2.
      - name: Exclude build dirs from Defender (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}", "${{ runner.temp }}"

      - uses: actions/checkout@v7

      # Ubuntu 24.04's apt ships Qt 6.4.2, which has a static-QML-module
      # qmlcachegen bug: file-based .qml components ("SideRail is not a type")
      # don't resolve in a downstream Quick Test binary, forcing heap_qml_tests
      # to be skipped on Linux (HEAP-71). A newer Qt (matching the working local
      # 6.8/6.9) fixes it, so provision Qt via install-qt-action instead of apt.
      - name: Install build tools + system libs (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libfontconfig1-dev libfreetype-dev libdbus-1-3

      - name: Install Qt6 (linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.1"
          cache: true
          modules: qtnetworkauth

      # Linux + macOS. Windows builds inside MSYS2 with MSYS2's own ccache, so
      # it only needs the cache directory carried between runs (below).
      - name: Setup ccache (linux, macos)
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache

      # Without this the MSYS2 ccache starts empty on every run and only adds
      # overhead. Unique key per commit so each run saves; restore-keys picks
      # up the newest one, a PR's own or master's.
      - name: Restore ccache (windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-

      # Same update policy and Qt package set as release.yml's package-windows,
      # so CI tests the Qt that ships. qt6-svg and qtkeychain were missing here;
      # a release without Qt6Svg (v0.4.3) went unnoticed partly because of it.
      - name: Setup MSYS2 (windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qtkeychain
            mingw-w64-ucrt-x86_64-qt6-networkauth
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ccache

      # macOS: build the .app bundle + tests to validate the native bundle,
      # Objective-C++ Carbon hotkey backend, and tray-fallback notifications
      # (HEAP-68). Qt 6.8.1 to match Linux.
      - name: Install Qt6 (macos)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.1"
          cache: true
          modules: qtnetworkauth

      - name: Install ninja (macos)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure (macos)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache

      - name: Build (macos)
        if: runner.os == 'macOS'
        run: |
          cmake --build build --parallel --target heap heap_all_tests

      - name: Configure (linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build (linux)
        if: runner.os == 'Linux'
        run: |
          cmake --build build --parallel --target heap heap_all_tests

      - name: Configure (windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build (windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 500M
        run: |
          ccache -z
          cmake --build build --parallel --target heap heap_all_tests
          ccache -s

      # Tests run on the runner that built them. A separate test job meant a
      # tarred build tree up and down, a second Qt / MSYS2 install, and — via
      # `needs: build` on the whole matrix — Linux tests waiting for the macOS
      # build to finish.
      #
      # --parallel: every suite is its own process with its own test-mode data
      # dir (named after the executable), so they are safe to run side by side.
      # heap_qml_tests is the long pole and carries a COST so it starts first.
      # --timeout: a hung suite fails in minutes instead of eating the job.
      - name: Run ctest (linux, macos)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ctest --test-dir build/tests \
            --parallel "$(getconf _NPROCESSORS_ONLN)" \
            --timeout 300 \
            --output-on-failure \
            --output-junit ctest-${{ matrix.os }}.xml

      # Windows: must run inside the msys2 shell so /ucrt64/bin (Qt6Core.dll
      # etc.) is on PATH — otherwise the test exe fails to launch with
      # STATUS_DLL_NOT_FOUND (0xc0000135).
      - name: Run ctest (windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ctest --test-dir build/tests \
            --parallel "$(getconf _NPROCESSORS_ONLN)" \
            --timeout 300 \
            --output-on-failure \
            --output-junit ctest-${{ matrix.os }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: build/tests/ctest-${{ matrix.os }}.xml

      - name: Render test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: tests (${{ matrix.os }})
          path: build/tests/ctest-${{ matrix.os }}.xml
          reporter: java-junit
          fail-on-error: false

      # macOS packaging smoke-test, on the bundle this job already built.
      # Exercises the release `.dmg` assembly with ad-hoc signing (no secrets),
      # so a change that re-breaks the bundle signature or the dmg layout fails
      # HERE — via `codesign --verify` — instead of shipping a "damaged" artifact
      # from release.yml's package-macos, which this mirrors (arm64, deployment
      # target 12.0, macdeployqt relocation guard, ad-hoc sign, drag-install dmg).
      # It used to be its own job: a second macOS runner, Qt install and build.
      - name: Deploy + ad-hoc sign + assemble dmg (macos)
        if: runner.os == 'macOS'
        run: |
          set -eu
          macdeployqt build/heap.app -qmldir="$PWD/qml"
          test -d build/heap.app/Contents/Frameworks/QtCore.framework
          if otool -L build/heap.app/Contents/MacOS/heap | grep -Eiq '/Users/runner/work/.*Qt|/aqt'; then
            echo "::error::macdeployqt left absolute Qt paths — relocation failed"
            exit 1
          fi
          # The re-sign + verify that the original workflow was missing: an
          # invalidated signature (the "damaged" bug) fails this verify.
          codesign --force --deep --sign - build/heap.app
          codesign --verify --deep --strict --verbose=2 build/heap.app
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R build/heap.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "heap" -srcfolder "$STAGE" -fs HFS+ -format UDZO -ov smoke.dmg

      - name: Verify dmg mounts with the app + Applications target (macos)
        if: runner.os == 'macOS'
        run: |
          set -eu
          hdiutil attach smoke.dmg -nobrowse -mountpoint /Volumes/heap
          test -d /Volumes/heap/heap.app
          test -L /Volumes/heap/Applications
          hdiutil detach /Volumes/heap

  # ──────────────────────────────────────────────────────────────────
  # 7. ASan + UBSan run (Linux only).
  # ──────────────────────────────────────────────────────────────────
  sanitizers:
    name: ASan + UBSan
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # A cold-cache sanitizer build has taken up to 24 minutes; at 25 the job
    # was cancelled and turned master red with nothing wrong in the code.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools + system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libfontconfig1-dev libfreetype-dev libdbus-1-3

      # Qt via install-qt-action (6.8.1) — apt's 6.4.2 can't run heap_qml_tests
      # (HEAP-71); its own QML modules ship with the install.
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.1"
          cache: true
          modules: qtnetworkauth

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-asan-ccache
          # -g + sanitizer objects are several times larger than Release ones.
          max-size: 1G

      - name: Configure with sanitizers
        run: |
          cmake -S . -B build-san -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHEAP_ENABLE_SANITIZERS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build tests
        run: |
          cmake --build build-san --parallel --target heap_all_tests

      - name: Run tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          # heap_selection_tests instantiates AppController under offscreen
          # QPA. AppController owns a NotificationCenter (tray fallback) and
          # a GitWatcher that touch global Qt singletons whose teardown order
          # is undefined at process exit — leak detector flags those as
          # one-shot "still reachable" allocations. They are not real leaks;
          # mute LSan for the sanitizer job so the run stays meaningful.
          LSAN_OPTIONS: detect_leaks=0
          QT_QPA_PLATFORM: offscreen
        run: |
          # Sanitized suites run several times slower, hence the longer limit.
          ctest --test-dir build-san/tests \
            --parallel "$(getconf _NPROCESSORS_ONLN)" \
            --timeout 600 \
            --output-on-failure

  # ──────────────────────────────────────────────────────────────────
  # 8. Aggregator — single required status check for branch protection.
  #
  # Branch-protection rules in GitHub require each contributing job to be
  # listed explicitly; adding a new job means editing the rule every time.
  # This `ci` job depends on every real job in the workflow and reports its
  # combined result. Add only `ci` to "Required status checks" on master and
  # any new job is automatically covered as soon as it is added to `needs:`
  # below.
  #
  # `if: always()` ensures this job runs even when a dependency fails or is
  # skipped (PR-only jobs like format-cpp/tidy are skipped on push). The
  # gating logic treats `skipped` and `success` as OK and only fails on
  # `failure` or `cancelled` — so the check is green on push (where the
  # PR-only jobs don't run) and on PRs alike.
  # ──────────────────────────────────────────────────────────────────
  ci:
    name: ci
    if: always()
    needs:
      - changes
      - lint-actions
      - format-cpp
      - tidy
      - build
      - sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check dependency results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          echo "Dependency results:"
          echo "$NEEDS_JSON"
          if echo "$NEEDS_JSON" | grep -E '"result": *"(failure|cancelled)"' >/dev/null; then
            echo "::error::At least one required job failed or was cancelled."
            exit 1
          fi
          echo "All required jobs succeeded or were skipped."

  # ──────────────────────────────────────────────────────────────────
  # 9. Coverage (Linux only) — DISABLED.
  # Re-enable by uncommenting the block below. Requires `CODECOV_TOKEN`
  # secret for upload (private repo). Without it, coverage.lcov is still
  # produced and kept as a build artifact.
  # ──────────────────────────────────────────────────────────────────
  # coverage:
  #   name: coverage
  #   runs-on: ubuntu-24.04
  #   timeout-minutes: 20
  #   needs: test
  #   steps:
  #     - uses: actions/checkout@v7
  #
  #     - name: Install toolchain
  #       run: |
  #         sudo apt-get update
  #         sudo apt-get install -y --no-install-recommends \
  #           cmake ninja-build g++ gcovr \
  #           qt6-base-dev qt6-declarative-dev qt6-tools-dev \
  #           libgl1-mesa-dev libegl1-mesa-dev
  #
  #     - name: Configure with coverage
  #       run: |
  #         cmake -S . -B build-cov -G Ninja \
  #           -DCMAKE_BUILD_TYPE=Debug \
