name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  # dorny/test-reporter posts a Check Run with test details on PRs.
  # Private repos need explicit grants — defaulting GITHUB_TOKEN to read-only
  # breaks the action with HTTP 403 "Resource not accessible by integration".
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:

  # ──────────────────────────────────────────────────────────────────
  # 1. C++ format check (diff-only).
  # ──────────────────────────────────────────────────────────────────
  lint-cpp:
    name: clang-format (diff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Run clang-format-diff on changed lines
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/changed_files.sh
          mapfile -t files < <(.github/scripts/changed_files.sh 'cpp|cc|cxx|h|hpp|hxx')
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No C/C++ changes — skipping."
            exit 0
          fi
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            base="origin/${GITHUB_BASE_REF}"
          else
            base="$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)"
          fi
          echo "Diffing changed lines vs $base"
          # Locate clang-format-diff (Ubuntu ships it as a versioned binary).
          diff_tool="$(command -v clang-format-diff || true)"
          if [[ -z "$diff_tool" ]]; then
            # Use a glob expansion (not `ls`) — quiets shellcheck SC2012 and
            # avoids word-splitting on filenames with spaces.
            shopt -s nullglob
            candidates=(/usr/bin/clang-format-diff-*)
            shopt -u nullglob
            if (( ${#candidates[@]} > 0 )); then
              diff_tool="${candidates[-1]}"
            fi
          fi
          if [[ -z "$diff_tool" ]]; then
            echo "::error::clang-format-diff not found in PATH"
            exit 1
          fi
          git diff -U0 "$base" HEAD -- "${files[@]}" \
            | "$diff_tool" -p1 -style=file > diff.patch
          if [[ -s diff.patch ]]; then
            echo "::error::clang-format violations on changed lines."
            echo "Suggested patch:"
            cat diff.patch
            exit 1
          fi
          echo "All changed lines are properly formatted."

  # ──────────────────────────────────────────────────────────────────
  # 2. QML lint (only files touched by the PR).
  # ──────────────────────────────────────────────────────────────────
  lint-qml:
    name: qmllint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt6 declarative tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-declarative-dev qt6-declarative-dev-tools

      - name: qmllint changed files
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/changed_files.sh
          mapfile -t files < <(.github/scripts/changed_files.sh 'qml')
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No QML changes — skipping."
            exit 0
          fi
          qmllint -I qml "${files[@]}"

  # ──────────────────────────────────────────────────────────────────
  # 3. GitHub Actions YAML lint (full sweep — fast).
  # ──────────────────────────────────────────────────────────────────
  lint-actions:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2
        with:
          files: ".github/workflows/*.yml"

  # ──────────────────────────────────────────────────────────────────
  # 4. clang-tidy on the diff (PR only).
  # ──────────────────────────────────────────────────────────────────
  tidy:
    name: clang-tidy (diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-tidy cmake ninja-build \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev libgl1-mesa-dev

      - name: Configure (compile_commands.json)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DHEAP_BUILD_TESTS=OFF

      - name: Build Qt-generated sources only
        # AUTOMOC / qmltyperegistrations files only exist after a partial
        # build; clang-tidy fails to find them otherwise.
        run: cmake --build build --target heap_autogen heap_qmltyperegistrations || true

      - name: Run clang-tidy on changed files
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/changed_files.sh
          mapfile -t files < <(.github/scripts/changed_files.sh 'cpp|cc|cxx')
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No C/C++ source changes — skipping clang-tidy."
            exit 0
          fi
          # Filter to files that actually have a compile-commands entry.
          tidy_files=()
          for f in "${files[@]}"; do
            if grep -q "\"file\": *\"$(pwd)/$f\"" build/compile_commands.json; then
              tidy_files+=("$f")
            fi
          done
          if [[ ${#tidy_files[@]} -eq 0 ]]; then
            echo "No source files with compile-commands entries — skipping."
            exit 0
          fi
          echo "Running clang-tidy on: ${tidy_files[*]}"
          clang-tidy --warnings-as-errors='*' -p build "${tidy_files[@]}"

  # ──────────────────────────────────────────────────────────────────
  # 5. Build matrix (Linux + Windows).
  # ──────────────────────────────────────────────────────────────────
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - name: Setup ccache (linux)
        if: runner.os == 'Linux'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache

      - name: Setup MSYS2 (windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ccache

      - name: Configure (linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build (linux)
        if: runner.os == 'Linux'
        run: |
          cmake --build build --parallel \
            --target heap heap_chrono_tests heap_git_tests heap_text_tests

      - name: Configure (windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build (windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake --build build --parallel \
            --target heap heap_chrono_tests heap_git_tests heap_text_tests

      - name: Tar build dir
        if: always()
        shell: bash
        run: tar -cf build-${{ matrix.os }}.tar build

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: build-${{ matrix.os }}.tar
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────
  # 6. Test (depends on build via artifact).
  # ──────────────────────────────────────────────────────────────────
  test:
    name: test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 runtime (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libqt6core6 libqt6gui6 libqt6qml6 libqt6quick6 \
            libqt6quickcontrols2-6 libqt6widgets6 \
            cmake ninja-build

      - name: Setup MSYS2 (windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-cmake

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.os }}

      - name: Untar build
        shell: bash
        run: tar -xf build-${{ matrix.os }}.tar

      # Linux: native bash, Qt DLLs picked up via ld.so.cache.
      - name: Run ctest (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ctest --test-dir build/tests \
            --output-on-failure \
            --output-junit ctest-${{ matrix.os }}.xml

      # Windows: must run inside the msys2 shell so /ucrt64/bin (Qt6Core.dll
      # etc.) is on PATH — otherwise the test exe fails to launch with
      # STATUS_DLL_NOT_FOUND (0xc0000135).
      - name: Run ctest (windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ctest --test-dir build/tests \
            --output-on-failure \
            --output-junit ctest-${{ matrix.os }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: build/tests/ctest-${{ matrix.os }}.xml

      - name: Render test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: tests (${{ matrix.os }})
          path: build/tests/ctest-${{ matrix.os }}.xml
          reporter: java-junit
          fail-on-error: false

  # ──────────────────────────────────────────────────────────────────
  # 7. ASan + UBSan run (Linux only).
  # ──────────────────────────────────────────────────────────────────
  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - name: Configure with sanitizers
        run: |
          cmake -S . -B build-san -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHEAP_ENABLE_SANITIZERS=ON

      - name: Build tests
        run: |
          cmake --build build-san --parallel \
            --target heap_chrono_tests heap_git_tests heap_text_tests

      - name: Run tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          ctest --test-dir build-san/tests --output-on-failure

  # ──────────────────────────────────────────────────────────────────
  # 8. Coverage (Linux only) — currently disabled.
  # Private repo lacks CODECOV_TOKEN. Flip `if:` back to `true` (or just
  # remove the line) once a Codecov token is wired in via secrets.
  # ──────────────────────────────────────────────────────────────────
  coverage:
    name: coverage
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ gcovr \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - name: Configure with coverage
        run: |
          cmake -S . -B build-cov -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHEAP_ENABLE_COVERAGE=ON

      - name: Build tests
        run: |
          cmake --build build-cov --parallel \
            --target heap_chrono_tests heap_git_tests heap_text_tests

      - name: Run tests
        run: ctest --test-dir build-cov/tests --output-on-failure

      - name: Generate lcov report
        run: |
          gcovr --root . \
            --filter 'src/.*' \
            --exclude '.*_autogen.*' \
            --lcov coverage.lcov \
            --print-summary

      # Always keep the raw report as an artifact so the data isn't lost when
      # Codecov is unreachable (private repo without a token, etc.).
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.lcov
          retention-days: 7

      # Codecov upload is gated on the secret. Private repos without a token
      # would otherwise fail with "Token required - not valid tokenless
      # upload".
      - name: Upload to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          files: coverage.lcov
          fail_ci_if_error: true
          token: ${{ env.CODECOV_TOKEN }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
