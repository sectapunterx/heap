name: Release

# Cross-platform packaging. Fires automatically when a semver tag is pushed
# (git tag v1.2.3 && git push origin v1.2.3) — the tag drives every artifact
# name and the published release. Running it manually (workflow_dispatch)
# produces a dev test build (vX.Y.Z-dev.<sha>): artifacts are attached to the
# run, but nothing is tagged or published.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  # The nightly workflow's release dry run. Called from a branch, it builds
  # like a manual dispatch: a -dev version, nothing tagged or published.
  workflow_call:

# Read-only by default; the publish job asks for what it needs.
permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Resolve the version once so every packaging job agrees on artifact
  # naming and the publish job knows what to tag. CMakeLists' project()
  # VERSION is the single source of truth; a pushed tag must match it.
  # Outputs:
  #   tag        — vX.Y.Z (real) or vX.Y.Z-dev.<sha> (manual test build)
  #   release    — "true" only for a pushed tag (gates the publish job)
  #   prerelease — "true" for a hyphenated tag (rc/dev): never the update target
  # ──────────────────────────────────────────────────────────────────
  meta:
    name: Resolve version
    runs-on: ubuntu-24.04
    # Covers the wait for CI below (up to 90 minutes) plus the checkout.
    timeout-minutes: 95
    permissions:
      contents: read
      checks: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release: ${{ steps.tag.outputs.release }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve version & release kind
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          # Single source of truth for the numeric version.
          cmver=$(sed -nE 's/^project\(heap VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n1)
          if [ -z "$cmver" ]; then
            echo "::error::could not read project VERSION from CMakeLists.txt"
            exit 1
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Real release: the pushed tag drives naming. Its numeric core must
            # equal the CMake version so the binary and the release never drift.
            tag="${{ github.ref_name }}"
            core="${tag#v}"; core="${core%%-*}"
            if [ "$core" != "$cmver" ]; then
              echo "::error::tag $tag core ($core) != CMakeLists project version ($cmver) — bump CMakeLists.txt before tagging"
              exit 1
            fi
            release=true
            # A hyphen (e.g. v1.1.0-rc.1) marks a pre-release: published, but
            # softprops keeps it off /releases/latest so the updater ignores it.
            case "$tag" in
              *-*) prerelease=true ;;
              *)   prerelease=false ;;
            esac
          else
            # Manual dispatch = test build only. A SemVer-valid pre-release string
            # so the in-app updater (Updater::isNewerVersion) ranks it OLDER than
            # any real release. No tag is created; the publish job is skipped.
            tag="v${cmver}-dev.$(git rev-parse --short HEAD)"
            release=false
            prerelease=true
          fi
          {
            echo "tag=$tag"
            echo "release=$release"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      # A tag may only ship a commit that passed CI. Master accepts admin
      # pushes that bypass the ruleset, so a tag can point at a commit whose
      # `ci` check is red, still running, or was never run. The version bump is
      # usually pushed moments before its tag, so wait for the check to finish
      # rather than failing on "in progress". A manual test build skips this.
      # The owner can waive it for one release (the change already passed CI
      # on its PR) with the repository variable RELEASE_SKIP_CI_GATE=true;
      # unset it right after.
      - name: Require a green CI run for the tagged commit
        if: github.ref_type == 'tag' && vars.RELEASE_SKIP_CI_GATE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          for attempt in $(seq 1 180); do
            state=$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs?check_name=ci&filter=latest" \
              --jq '.check_runs | sort_by(.started_at) | last | if . == null then "missing" else "\(.status) \(.conclusion)" end')
            case "$state" in
              "completed success") echo "ci passed on $sha"; exit 0 ;;
              completed*)          echo "::error::ci on $sha finished as '${state#completed }' — fix master and re-tag"; exit 1 ;;
              *)                   echo "ci on $sha: $state (check $attempt/180)"; sleep 30 ;;
            esac
          done
          echo "::error::no finished ci run for $sha after 50 minutes — was this commit pushed to master?"
          exit 1

  # ──────────────────────────────────────────────────────────────────
  # Windows: portable zip (proven windeployqt bundle) + Inno Setup
  # installer (.exe).
  # ──────────────────────────────────────────────────────────────────
  package-windows:
    name: Package (Windows)
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    # Job-level env so the optional signing steps' `if:` can read the secret (a
    # step's own env is not reliably visible to its own `if`, and `secrets`
    # cannot be referenced in `if` directly). Mirrors the macOS signing pattern.
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORG_ID: ${{ vars.SIGNPATH_ORG_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup MSYS2 (UCRT64)
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-networkauth
            mingw-w64-ucrt-x86_64-qtkeychain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc

      - name: Add MSYS2 ucrt64/bin to PATH
        shell: pwsh
        run: |
          $ucrt = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
          "$ucrt" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Add Qt6 tool dirs to PATH
        shell: msys2 {0}
        run: |
          set -eu
          SCANNER=$(find /ucrt64 -name 'qmlimportscanner.exe' -print -quit 2>/dev/null || true)
          if [ -n "$SCANNER" ]; then
            cygpath -w "$(dirname "$SCANNER")" >> "$GITHUB_PATH"
          fi
          for d in /ucrt64/share/qt6/bin /ucrt64/share/qt6/libexec; do
            [ -d "$d" ] && cygpath -w "$d" >> "$GITHUB_PATH" || true
          done

      - name: Configure & build
        # Baked-in OAuth app credentials for one-click browser sign-in. CMake reads
        # these from the environment and writes a generated header into the build
        # tree — never a -D, which would land in CMakeCache.txt and
        # compile_commands.json. Unset secrets simply leave that provider on the
        # personal-access-token path, so a fork builds fine without them.
        env:
          HEAP_OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.HEAP_OAUTH_GITHUB_CLIENT_SECRET }}
          HEAP_OAUTH_GITLAB_CLIENT_SECRET: ${{ secrets.HEAP_OAUTH_GITLAB_CLIENT_SECRET }}
          HEAP_OAUTH_JIRA_CLIENT_ID: ${{ secrets.HEAP_OAUTH_JIRA_CLIENT_ID }}
          HEAP_OAUTH_JIRA_CLIENT_SECRET: ${{ secrets.HEAP_OAUTH_JIRA_CLIENT_SECRET }}
          HEAP_OAUTH_TRELLO_CLIENT_ID: ${{ secrets.HEAP_OAUTH_TRELLO_CLIENT_ID }}
          HEAP_OAUTH_TODOIST_CLIENT_ID: ${{ secrets.HEAP_OAUTH_TODOIST_CLIENT_ID }}
          HEAP_OAUTH_TODOIST_CLIENT_SECRET: ${{ secrets.HEAP_OAUTH_TODOIST_CLIENT_SECRET }}
          HEAP_OAUTH_ASANA_CLIENT_ID: ${{ secrets.HEAP_OAUTH_ASANA_CLIENT_ID }}
          HEAP_OAUTH_ASANA_CLIENT_SECRET: ${{ secrets.HEAP_OAUTH_ASANA_CLIENT_SECRET }}
          HEAP_OAUTH_CLICKUP_CLIENT_ID: ${{ secrets.HEAP_OAUTH_CLICKUP_CLIENT_ID }}
          HEAP_OAUTH_CLICKUP_CLIENT_SECRET: ${{ secrets.HEAP_OAUTH_CLICKUP_CLIENT_SECRET }}
          HEAP_OAUTH_BITBUCKET_CLIENT_ID: ${{ secrets.HEAP_OAUTH_BITBUCKET_CLIENT_ID }}
          HEAP_OAUTH_BITBUCKET_CLIENT_SECRET: ${{ secrets.HEAP_OAUTH_BITBUCKET_CLIENT_SECRET }}
        shell: msys2 {0}
        run: |
          MSYS_ROOT=$(cygpath -m "${{ steps.msys2.outputs.msys2-location }}")
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMSYS_ROOT="$MSYS_ROOT"
          cmake --build build --target heap --parallel $(nproc)

      - name: Assemble portable bundle
        shell: msys2 {0}
        run: |
          set -eu
          MSYS_BASE_UNIX=$(cygpath -u "${{ steps.msys2.outputs.msys2-location }}")
          export PATH="$MSYS_BASE_UNIX/ucrt64/bin:$MSYS_BASE_UNIX/ucrt64/share/qt6/libexec:$MSYS_BASE_UNIX/ucrt64/share/qt6/bin:$PATH"
          cmake --build build --target portable

      # Start the bundle exactly as a user would get it — PATH without MSYS2,
      # so a DLL or plugin windeployqt/copy-deps missed (the v0.4.3 zip shipped
      # without Qt6Svg and the UCRT) fails the release instead of the user.
      - name: Smoke-test the portable bundle
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $dataDir = Join-Path $env:RUNNER_TEMP 'smoke'
          # GUI-subsystem binary with no console: the verdict goes to the
          # redirected stderr, the run's log is kept as logs\smoke.log.
          $err = Join-Path $env:RUNNER_TEMP 'smoke-stderr.txt'
          $p = Start-Process -FilePath build\heap-portable\lowkey.exe `
                 -ArgumentList '--smoke', '--data-dir', $dataDir `
                 -RedirectStandardError $err -Wait -PassThru
          Get-Content $err -ErrorAction SilentlyContinue
          Get-Content (Join-Path $dataDir 'logs\smoke.log') -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "smoke failed with exit code $($p.ExitCode)"; exit 1 }

      # Authenticode-sign lowkey.exe + the bundled Qt DLLs before they are
      # packaged, so both the portable zip and the installer carry signed
      # binaries. Signing runs via SignPath Foundation (free OSS code signing):
      # the unsigned bundle is uploaded as a workflow artifact, SignPath pulls
      # it, signs the configured PE files, and the signed files are written back
      # over build/heap-portable. Runs only when SIGNPATH_API_TOKEN is
      # configured — unsigned builds still ship (default). See docs/PACKAGING.md.
      # Half a configuration is a mistake, not an opt-out: a token without the
      # three variables would fail deep inside the SignPath action with an
      # unhelpful message, so say which one is missing up front. With no token
      # at all the signing steps below are skipped and the build ships
      # unsigned, as before (see docs/PACKAGING.md → Windows signing).
      - name: Check the SignPath configuration
        shell: bash
        run: |
          if [ -z "$SIGNPATH_API_TOKEN" ]; then
            echo "SignPath: SIGNPATH_API_TOKEN not set — Windows binaries will be unsigned"
            exit 0
          fi
          missing=""
          for v in SIGNPATH_ORG_ID SIGNPATH_PROJECT_SLUG SIGNPATH_POLICY_SLUG; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::SIGNPATH_API_TOKEN is set but these repository variables are not:$missing"
            exit 1
          fi

      - name: Upload unsigned portable bundle
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        id: upload-portable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-portable
          path: build/heap-portable

      - name: Sign portable bundle (SignPath)
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: portable
          github-artifact-id: ${{ steps.upload-portable.outputs.artifact-id }}
          wait-for-completion: true
          # Overwrite the bundle in place so the zip + installer below wrap the
          # signed binaries.
          output-artifact-directory: build/heap-portable

      # A signing request that "succeeded" but handed back unsigned files (a
      # wrong artifact configuration matches nothing) must not ship as signed.
      - name: Verify the portable signatures
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        shell: pwsh
        run: |
          $bad = Get-ChildItem build\heap-portable -Recurse -Include *.exe,*.dll |
                 Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($bad) { $bad | ForEach-Object { Write-Host "unsigned: $($_.FullName)" }; Write-Error "$($bad.Count) PE file(s) not signed"; exit 1 }
          Write-Host "every PE file in the bundle carries a valid Authenticode signature"

      - name: Zip portable bundle
        shell: pwsh
        run: Compress-Archive -Path "build\heap-portable\*" -DestinationPath "lowkey-${{ needs.meta.outputs.tag }}-windows-portable.zip"

      # Inno Setup ships an installer that drops Start-menu shortcuts and an
      # uninstaller. It packages the exact same portable bundle directory.
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion="${{ needs.meta.outputs.tag }}" `
            /DBundleDir="$($PWD.Path)\build\heap-portable" `
            "/Flowkey-${{ needs.meta.outputs.tag }}-windows-setup" `
            installer\lowkey.iss

      # Sign the finished installer .exe (the portable binaries it wraps were
      # already signed above). Same SignPath flow, second artifact config — the
      # signed setup.exe is written back over installer/Output. Same gate — no-op
      # without the token secret.
      - name: Upload unsigned installer
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        id: upload-installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-installer
          path: installer/Output/lowkey-${{ needs.meta.outputs.tag }}-windows-setup.exe

      - name: Sign installer (SignPath)
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: installer/Output

      - name: Verify the installer signature
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "installer\Output\lowkey-${{ needs.meta.outputs.tag }}-windows-setup.exe"
          if ($sig.Status -ne 'Valid') { Write-Error "setup.exe signature: $($sig.Status)"; exit 1 }
          Write-Host "setup.exe signed by $($sig.SignerCertificate.Subject)"

      # Same as the macOS note: unsigned binaries are not fatal (no signing
      # account is configured yet) but a stable release says so.
      - name: Flag an unsigned stable Windows release
        if: ${{ env.SIGNPATH_API_TOKEN == '' && needs.meta.outputs.prerelease == 'false' }}
        shell: bash
        run: echo "::warning::stable release with unsigned Windows binaries — SmartScreen will warn; see docs/PACKAGING.md → Windows signing"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-windows
          path: |
            lowkey-${{ needs.meta.outputs.tag }}-windows-portable.zip
            installer/Output/lowkey-${{ needs.meta.outputs.tag }}-windows-setup.exe
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # Linux: one AppImage, built on Qt 6.9.1 — the Qt CI tests — with Qt bundled.
  # Earlier releases also shipped a .deb and a tarball built against Ubuntu
  # 24.04's system Qt 6.4.2; the UI does not run on 6.4 (Main.qml's compiled
  # bindings hang, and without them the TodoCpp singletons fail to resolve), so
  # those are gone. The AppImage is no longer best-effort: it is the Linux
  # artifact, and it has to build and pass its smoke test for the release to
  # publish.
  # ──────────────────────────────────────────────────────────────────
  package-linux:
    name: Package (Linux)
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The xcb libraries are here so linuxdeploy finds and bundles what Qt's
      # xcb platform plugin needs (libxcb-cursor0 among them, required since
      # Qt 6.5 and missing from many desktops).
      - name: Install build tools + system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ file \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1-dev libfreetype-dev libdbus-1-3 libxcb1-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      # Same Qt as CI. QtKeychain is not on aqt, so, as on macOS, SecretStore
      # keeps tokens in its secrets.json fallback.
      - name: Install Qt6
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.9.1"
          cache: true
          modules: qtnetworkauth

      - name: Configure & build
        # Baked-in OAuth app credentials for one-click browser sign-in. CMake reads
        # these from the environment and writes a generated header into the build
        # tree — never a -D, which would land in CMakeCache.txt and
        # compile_commands.json. Unset secrets simply leave that provider on the
        # personal-access-token path, so a fork builds fine without them.
        env:
          HEAP_OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.HEAP_OAUTH_GITHUB_CLIENT_SECRET }}
          HEAP_OAUTH_GITLAB_CLIENT_SECRET: ${{ secrets.HEAP_OAUTH_GITLAB_CLIENT_SECRET }}
          HEAP_OAUTH_JIRA_CLIENT_ID: ${{ secrets.HEAP_OAUTH_JIRA_CLIENT_ID }}
          HEAP_OAUTH_JIRA_CLIENT_SECRET: ${{ secrets.HEAP_OAUTH_JIRA_CLIENT_SECRET }}
          HEAP_OAUTH_TRELLO_CLIENT_ID: ${{ secrets.HEAP_OAUTH_TRELLO_CLIENT_ID }}
          HEAP_OAUTH_TODOIST_CLIENT_ID: ${{ secrets.HEAP_OAUTH_TODOIST_CLIENT_ID }}
          HEAP_OAUTH_TODOIST_CLIENT_SECRET: ${{ secrets.HEAP_OAUTH_TODOIST_CLIENT_SECRET }}
          HEAP_OAUTH_ASANA_CLIENT_ID: ${{ secrets.HEAP_OAUTH_ASANA_CLIENT_ID }}
          HEAP_OAUTH_ASANA_CLIENT_SECRET: ${{ secrets.HEAP_OAUTH_ASANA_CLIENT_SECRET }}
          HEAP_OAUTH_CLICKUP_CLIENT_ID: ${{ secrets.HEAP_OAUTH_CLICKUP_CLIENT_ID }}
          HEAP_OAUTH_CLICKUP_CLIENT_SECRET: ${{ secrets.HEAP_OAUTH_CLICKUP_CLIENT_SECRET }}
          HEAP_OAUTH_BITBUCKET_CLIENT_ID: ${{ secrets.HEAP_OAUTH_BITBUCKET_CLIENT_ID }}
          HEAP_OAUTH_BITBUCKET_CLIENT_SECRET: ${{ secrets.HEAP_OAUTH_BITBUCKET_CLIENT_SECRET }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHEAP_BUILD_TESTS=OFF
          cmake --build build --parallel --target heap

      - name: Build AppImage
        run: |
          set -eu
          # Checked against known hashes: `continuous` is rebuilt in place, so
          # the tool that went into a release could change unseen. linuxdeploy
          # is pinned to a tagged release; the Qt plugin's last tag is too old,
          # so it stays on `continuous` but only the build hashed here is used —
          # when upstream rebuilds it, this step fails until the hash is bumped.
          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          sha256sum -c - <<'SUMS'
          c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy
          cfc1055b2b9dbc08412b579f20990b7b41a17b61beaa5847dc9477c96c9e9617  linuxdeploy-plugin-qt
          SUMS
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          # ubuntu-24.04 has fuse3, not libfuse2 — run the AppImage tools by
          # self-extracting instead of mounting.
          export APPIMAGE_EXTRACT_AND_RUN=1
          # The Qt to bundle is install-qt-action's, not a system one.
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export QML_SOURCES_PATHS="$PWD/qml"
          export EXTRA_QT_PLUGINS="svg"
          export OUTPUT="lowkey-${{ needs.meta.outputs.tag }}-linux-x86_64.AppImage"
          # --icon-filename must match the desktop file's Icon=lowkey key.
          ./linuxdeploy --appdir AppDir \
            --executable build/lowkey \
            --desktop-file packaging/linux/lowkey.desktop \
            --icon-file design/brand-export/lowkey/lowkey-icon.svg \
            --icon-filename lowkey \
            --plugin qt --output appimage
          test -f "$OUTPUT"

      # In a clean ubuntu:24.04 that has only what a desktop has, so anything
      # the AppImage fails to bundle shows up here rather than on a user's
      # machine. The script lives in a file: a quoted bash -c string once ran
      # half of a test on the runner because of one apostrophe.
      - name: Smoke-test the AppImage in a clean container
        timeout-minutes: 10
        env:
          IMG: lowkey-${{ needs.meta.outputs.tag }}-linux-x86_64.AppImage
        run: docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 bash packaging/linux/smoke-appimage.sh "$IMG"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux
          path: lowkey-${{ needs.meta.outputs.tag }}-linux-x86_64.AppImage
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # macOS: .app via macdeployqt + .dmg. Unsigned by default; if the
  # signing secrets are present the bundle is codesigned + notarized.
  # ──────────────────────────────────────────────────────────────────
  package-macos:
    name: Package (macOS)
    # Re-enabled in HEAP-68: the earlier failure was install-qt-action on Qt
    # 6.7.* / macos-14; 6.9.1 provisions fine (same version now used across CI),
    # and the .app bundle (Info.plist + Carbon hotkey) builds there. Qt 6.9+ is
    # required for the browser-OAuth device flow (QOAuth2DeviceAuthorizationFlow).
    needs: meta
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: read
    # Job-level env so the optional signing step's `if:` can read it (a step's
    # own env is not reliably visible to its own `if`, and `secrets` cannot be
    # referenced in `if` directly).
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ninja
        run: brew install ninja

      - name: Install Qt6
        # qtdeclarative is an essential module bundled with the base install
        # (passing it to aqt errors). qtnetworkauth is an add-on the browser
        # OAuth flow needs, so it must be requested explicitly. QtKeychain isn't
        # on aqt — SecretStore falls back to secrets.json on macOS.
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.9.1"
          modules: qtnetworkauth

      # The app icon (.icns) is in the repo (design/brand-export/lowkey,
      # built with the rest of the logo package), so there is nothing to make.

      # arm64 (native to macos-14). CMAKE_OSX_DEPLOYMENT_TARGET pins the Mach-O
      # `minos` to match Info.plist's LSMinimumSystemVersion (12.0) — otherwise it
      # is stamped from the runner SDK (14), silently blocking macOS 12/13 users.
      - name: Configure & build
        # Baked-in OAuth app credentials for one-click browser sign-in. CMake reads
        # these from the environment and writes a generated header into the build
        # tree — never a -D, which would land in CMakeCache.txt and
        # compile_commands.json. Unset secrets simply leave that provider on the
        # personal-access-token path, so a fork builds fine without them.
        env:
          HEAP_OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.HEAP_OAUTH_GITHUB_CLIENT_SECRET }}
          HEAP_OAUTH_GITLAB_CLIENT_SECRET: ${{ secrets.HEAP_OAUTH_GITLAB_CLIENT_SECRET }}
          HEAP_OAUTH_JIRA_CLIENT_ID: ${{ secrets.HEAP_OAUTH_JIRA_CLIENT_ID }}
          HEAP_OAUTH_JIRA_CLIENT_SECRET: ${{ secrets.HEAP_OAUTH_JIRA_CLIENT_SECRET }}
          HEAP_OAUTH_TRELLO_CLIENT_ID: ${{ secrets.HEAP_OAUTH_TRELLO_CLIENT_ID }}
          HEAP_OAUTH_TODOIST_CLIENT_ID: ${{ secrets.HEAP_OAUTH_TODOIST_CLIENT_ID }}
          HEAP_OAUTH_TODOIST_CLIENT_SECRET: ${{ secrets.HEAP_OAUTH_TODOIST_CLIENT_SECRET }}
          HEAP_OAUTH_ASANA_CLIENT_ID: ${{ secrets.HEAP_OAUTH_ASANA_CLIENT_ID }}
          HEAP_OAUTH_ASANA_CLIENT_SECRET: ${{ secrets.HEAP_OAUTH_ASANA_CLIENT_SECRET }}
          HEAP_OAUTH_CLICKUP_CLIENT_ID: ${{ secrets.HEAP_OAUTH_CLICKUP_CLIENT_ID }}
          HEAP_OAUTH_CLICKUP_CLIENT_SECRET: ${{ secrets.HEAP_OAUTH_CLICKUP_CLIENT_SECRET }}
          HEAP_OAUTH_BITBUCKET_CLIENT_ID: ${{ secrets.HEAP_OAUTH_BITBUCKET_CLIENT_ID }}
          HEAP_OAUTH_BITBUCKET_CLIENT_SECRET: ${{ secrets.HEAP_OAUTH_BITBUCKET_CLIENT_SECRET }}
        run: |
          set -eu
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHEAP_BUILD_TESTS=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build --parallel --target heap
          test -d build/lowkey.app

      # Bundle Qt frameworks/plugins into the .app. NOTE: no -dmg — the .app must
      # be code-signed AFTER macdeployqt (its install_name_tool rpath rewrites
      # invalidate the linker's ad-hoc arm64 signatures, which is what makes the
      # downloaded app read as "damaged") and BEFORE it is sealed into a read-only
      # dmg. macdeployqt exits 0 even on failure, so verify the relocation worked.
      - name: Deploy Qt into the bundle
        run: |
          set -eu
          macdeployqt build/lowkey.app -qmldir="$PWD/qml"
          test -d build/lowkey.app/Contents/Frameworks/QtCore.framework
          if otool -L build/lowkey.app/Contents/MacOS/lowkey | grep -Eiq '/Users/runner/work/.*Qt|/aqt'; then
            echo "::error::macdeployqt left absolute Qt paths — relocation failed"
            exit 1
          fi

      # Re-sign the bundle so the arm64 binary + rewritten frameworks carry a
      # VALID signature — this is the fix for the fatal Gatekeeper "damaged"
      # state. Developer ID + hardened runtime when the signing secret is present
      # (sign inside-out, app last); otherwise an ad-hoc signature, which is
      # enough to make the app openable via right-click → Open. Runs always
      # (branches internally) — unlike the notarize step it is not secret-gated.
      - name: Codesign the app
        run: |
          set -eu
          APP=build/lowkey.app
          if [ -n "${MACOS_CERT_P12:-}" ]; then
            echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p ci build.keychain
            security set-keychain-settings -lut 21600 build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p ci build.keychain
            security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
            IDENT="Developer ID Application"
            # inside-out: nested dylibs (incl. QML plugins), then framework
            # bundles, then the outer app. Consistent identity satisfies Library
            # Validation, so no disable-library-validation entitlement is needed.
            find "$APP" -name '*.dylib' -print0 \
              | xargs -0 -I{} codesign --force --options runtime --timestamp --sign "$IDENT" {}
            find "$APP/Contents/Frameworks" -type d -name '*.framework' -print0 \
              | xargs -0 -I{} codesign --force --options runtime --timestamp --sign "$IDENT" {}
            codesign --force --options runtime --timestamp \
              --entitlements packaging/macos/heap.entitlements --sign "$IDENT" "$APP"
            rm -f "$RUNNER_TEMP/cert.p12"
          else
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"

      # Assemble a drag-to-Applications .dmg by hand (hdiutil). This replaces
      # `macdeployqt -dmg`, whose bare image (just lowkey.app, no /Applications
      # target) is what made the mounted dmg look like a lone icon rather than an
      # installer. create-dmg is avoided — it drives Finder via AppleScript, which
      # hangs on headless runners.
      - name: Build .dmg
        run: |
          set -eu
          bash packaging/macos/make-dmg.sh build/lowkey.app "lowkey-${{ needs.meta.outputs.tag }}-macos.dmg"

      # Run the app from the mounted dmg — the bundle a user drags out.
      - name: Smoke-test the app from the dmg
        timeout-minutes: 5
        run: |
          set -eu
          hdiutil attach "lowkey-${{ needs.meta.outputs.tag }}-macos.dmg" -nobrowse -mountpoint /Volumes/lowkey
          trap 'hdiutil detach /Volumes/lowkey' EXIT
          /Volumes/lowkey/lowkey.app/Contents/MacOS/lowkey --smoke --data-dir "$RUNNER_TEMP/smoke"

      # Notarize only when the Apple secrets are configured — the .app is already
      # signed + hardened above. Sign the dmg, submit, staple, accept-check. Do
      # NOT run spctl on the ad-hoc default: it is expected to report "rejected".
      # See docs/PACKAGING.md for the required secret names.
      - name: Notarize & staple (optional)
        if: ${{ env.MACOS_CERT_P12 != '' }}
        run: |
          set -eu
          DMG="lowkey-${{ needs.meta.outputs.tag }}-macos.dmg"
          codesign --force --timestamp --sign "Developer ID Application" "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" --password "$MACOS_NOTARY_PASSWORD" \
            --team-id "$MACOS_NOTARY_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          spctl -a -t open --context context:primary-signature -vv "$DMG"

      # Without Apple's secrets the dmg is ad-hoc signed only, and Gatekeeper
      # tells users it "can't be checked for malicious software". Not fatal —
      # no Developer ID is configured yet — but a stable release says so rather
      # than shipping it silently; publish adds the same note to the release.
      - name: Flag an un-notarized stable release
        if: ${{ env.MACOS_CERT_P12 == '' && needs.meta.outputs.prerelease == 'false' }}
        run: echo "::warning::stable release with an un-notarized macOS dmg — set the MACOS_* secrets to notarize"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-macos
          path: lowkey-${{ needs.meta.outputs.tag }}-macos.dmg
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # Publish: gather every platform artifact into one GitHub Release.
  # ──────────────────────────────────────────────────────────────────
  publish:
    name: Publish release
    # Wait for macOS (so its .dmg is uploaded before we gather artifacts) but
    # don't let it block the release: as long as Windows + Linux packaged, we
    # publish whatever artifacts exist. A macOS failure no longer sinks the
    # whole release (it did twice before).
    needs: [meta, package-windows, package-linux, package-macos]
    # release=true only for a pushed tag, so a manual (workflow_dispatch) run
    # never publishes — its artifacts stay attached to the run as a test build.
    if: >-
      ${{ always() && needs.meta.result == 'success'
          && needs.meta.outputs.release == 'true'
          && needs.package-windows.result == 'success'
          && needs.package-linux.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write       # create the release
      id-token: write       # sign the provenance attestation (Sigstore)
      attestations: write   # store it with the repository
    env:
      MACOS_NOTARIZED: ${{ secrets.MACOS_CERT_P12 != '' }}
      WINDOWS_SIGNED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          # Only the packaged per-platform bundles — NOT the unsigned-* SignPath
          # transport artifacts, which would otherwise pollute the release with
          # unsigned duplicates.
          pattern: dist-*
          merge-multiple: true

      # The Windows artifact keeps its installer under installer/Output/, so
      # the setup .exe sat one level down and neither the checksum list nor
      # the attestation (both read dist/ only) covered it — v0.5.2's
      # SHA256SUMS has no line for it. Every asset goes to the top level.
      - name: Flatten artifacts
        run: |
          set -eu
          find dist -mindepth 2 -type f -exec mv -n -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
          if [ -n "$(find dist -mindepth 2 -type f)" ]; then
            echo "::error::two artifacts share a file name"; find dist -mindepth 2 -type f; exit 1
          fi

      - name: List artifacts
        run: find dist -type f -printf '%p (%s bytes)\n'

      # What went into the binaries (Qt frameworks and plugins, md4c,
      # qtkeychain, …), as catalogued from the packaged artifacts.
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: spdx-json
          output-file: dist/lowkey-${{ needs.meta.outputs.tag }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # A verifiable release: SHA256SUMS for a quick integrity check, and a
      # signed build-provenance attestation per artifact, which ties each file
      # to this workflow run and commit:
      #   gh attestation verify <file> --repo ${{ github.repository }}
      - name: Checksums
        working-directory: dist
        run: |
          set -eu
          sums=$(find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum)
          printf '%s\n' "$sums" > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Release notes preamble
        env:
          REPO: ${{ github.repository }}
        run: |
          {
            if [ "$MACOS_NOTARIZED" != "true" ]; then
              echo "> **macOS:** this build is not notarized. On first launch, right-click lowkey.app → **Open**."
              echo
            fi
            if [ "$WINDOWS_SIGNED" != "true" ]; then
              echo "> **Windows:** this build is not code-signed, so SmartScreen may say \"Windows protected your PC\". Choose **More info → Run anyway**, after checking the SHA-256 below."
              echo
            fi
            cat <<EOF
          Verify a download: \`sha256sum -c SHA256SUMS\`, or \`gh attestation verify <file> --repo $REPO\`.

          <details><summary>SHA-256 checksums</summary>

          \`\`\`
          EOF
            # The same lines as the SHA256SUMS asset, so a checksum can be read
            # off the release page without downloading anything else.
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo '</details>'
          } > notes.md
          cat notes.md

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: "lowkey ${{ needs.meta.outputs.tag }}"
          body_path: notes.md
          generate_release_notes: true
          # A full release becomes /releases/latest (the updater's target); a
          # hyphenated tag (rc/beta) is flagged pre-release and stays off latest.
          prerelease: ${{ needs.meta.outputs.prerelease }}
          make_latest: ${{ needs.meta.outputs.prerelease == 'false' }}
          files: dist/*
