        <text x="870" y="170" fill="#8a94a3">01 · SCOPE</text>
        <text x="870" y="200" font-family="&#39;IBM Plex Sans&#39;, Helvetica, Arial, sans-serif" font-size="15"
              font-weight="400" fill="#b8c2cc" letter-spacing="0">Board, week, day, docs, notes, contacts.
