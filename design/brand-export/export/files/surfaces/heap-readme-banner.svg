    <text x="80" y="340" font-family="&#39;IBM Plex Serif&#39;, Georgia, &#39;Times New Roman&#39;, serif"
          font-weight="300" font-size="68" letter-spacing="-1.2" fill="#e5ecf3">Work, in one place.
