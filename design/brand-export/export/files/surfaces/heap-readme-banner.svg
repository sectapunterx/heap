    <text x="80" y="540" font-family="&#39;JetBrains Mono&#39;, &#39;SF Mono&#39;, Menlo, Consolas, monospace"
          font-size="13" letter-spacing="1.8" fill="#5f6878">QT 6 · C++ 20 · MIT · ONE BINARY · NO SERVER
    </text>


    <line x1="820" y1="120" x2="820" y2="520" stroke="#262d39" stroke-width="1"></line>


    <g font-family="&#39;JetBrains Mono&#39;, &#39;SF Mono&#39;, Menlo, Consolas, monospace" font-size="11"
