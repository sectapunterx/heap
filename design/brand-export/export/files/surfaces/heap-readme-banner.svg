    </text>
    <text x="80" y="464" font-family="&#39;IBM Plex Serif&#39;, Georgia, &#39;Times New Roman&#39;, serif"
          font-weight="300" font-size="68" letter-spacing="-1.2" fill="#8a94a3">calendar, and notebook.
