  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Unpacking is all-or-nothing: if it throws, nothing will ever render, so
  // replace the splash with a plain message. Diagnostics stay in the console —
  // a visitor has no use for a stack trace, and a global error listener would
  // also surface unrelated resource failures.
  function fail(err) {
    console.error('Bundle unpack error:', err);
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;z-index:100000;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;padding:24px;text-align:center;background:#faf9f5;color:#3d3d3a;font:15px/1.5 -apple-system,BlinkMacSystemFont,sans-serif';
    const msg = document.createElement('p');
    msg.textContent = 'This page failed to load.';
    const link = document.createElement('a');
    link.href = 'https://github.com/sectapunterx/heap';
    link.textContent = 'View heap on GitHub';
    link.style.cssText = 'color:#0b7285';
    box.append(msg, link);
    (document.body || document.documentElement).appendChild(box);
  }

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      fail(new Error('missing bundle data (manifest: ' + !!manifestEl + ', template: ' + !!templateEl + ')'));
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    fail(err);
  }
});

\">one window · board · timeline · week · day · docs · notes<\u002Fp>\n        <\u002Fdiv>\n\n        <!-- ===== why / local-first ===== -->\n        <div style=\"border-top:1px solid #1c2230;padding:80px 48px\">\n          <p style=\"font:11px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#5f6878;margin:0 0 22px\"><span style=\"color:#3bccdd\">01<\u002Fspan> &nbsp;why heap.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:40px 64px;align-items:start\">\n            <h2 style=\"font-family:'IBM Plex Serif',serif;font-weight:400;font-size:44px;line-height:1.1;letter-spacing:-.01em;margin:0\">Local-first, and boring on&nbsp;purpose<\u002Fh2>\n            <div>\n              <p style=\"font-size:17px;line-height:1.65;color:#b8c2cc;margin:0 0 14px\">State is one JSON file under <span style=\"font-family:'JetBrains Mono',monospace;color:#8a94a3\">AppDataLocation<\u002Fspan>, backed up daily — a file you can read, diff, and back up. Your data never leaves the machine.<\u002Fp>\n              <p style=\"font-size:17px;line-height:1.65;color:#b8c2cc;margin:0\">The board is <em style=\"font-style:normal;color:#e5ecf3\">git-aware<\u002Fem>: it watches your working copy and matches the current branch to the task you're on — the card is decorated with its branch, no manual linking.<\u002Fp>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:22px\">\n                <span style=\"font:11px 'JetBrains Mono',monospace;color:#8a94a3;padding:5px 12px;border:1px solid #262d39;border-radius:999px\">local-first<\u002Fspan>\n                <span style=\"font:11px 'JetBrains Mono',monospace;color:#8a94a3;padding:5px 12px;border:1px solid #262d39;border-radius:999px\">git-aware<\u002Fspan>\n                <span style=\"font:11px 'JetBrains Mono',monospace;color:#8a94a3;padding:5px 12px;border:1px solid #262d39;border-radius:999px\">no telemetry<\u002Fspan>\n                <span style=\"font:11px 'JetBrains Mono',monospace;color:#8a94a3;padding:5px 12px;border:1px solid #262d39;border-radius:999px\">single binary<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#1c2230;border:1px solid #1c2230;border-radius:12px;overflow:hidden;margin-top:48px\">\n            <div style=\"background:#0b0e13;padding:28px 26px\"><div style=\"font-family:'IBM Plex Serif',serif;font-size:40px;color:#e5ecf3;line-height:1\">1<\u002Fdiv><div style=\"font:11px/1.4 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#5f6878;margin-top:8px\">native binary · one file<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:#0b0e13;padding:28px 26px\"><div style=\"font-family:'IBM Plex Serif',serif;font-size:40px;color:#e5ecf3;line-height:1\">6<\u002Fdiv><div style=\"font:11px/1.4 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#5f6878;margin-top:8px\">surfaces · one window<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:#0b0e13;padding:28px 26px\"><div style=\"font-family:'IBM Plex Serif',serif;font-size:40px;color:#e5ecf3;line-height:1\">0<\u002Fdiv><div style=\"font:11px/1.4 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#5f6878;margin-top:8px\">servers · runs offline<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:#0b0e13;padding:28px 26px\"><div style=\"font-family:'IBM Plex Serif',serif;font-size:40px;color:#e5ecf3;line-height:1\">13<\u002Fdiv><div style=\"font:11px/1.4 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#5f6878;margin-top:8px\">trackers · synced<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ===== quick-capture (from 1b) ===== -->\n        <div style=\"border-top:1px solid #1c2230;padding:80px 48px;background:#0d1117;text-align:center\">\n          <p style=\"font:11px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#5f6878;margin:0 0 10px\"><span style=\"color:#3bccdd\">02<\u002Fspan> &nbsp;quick-capture<\u002Fp>\n          <h2 style=\"font-family:'IBM Plex Serif',serif;font-weight:400;font-size:44px;line-height:1.1;letter-spacing:-.01em;margin:0 0 16px\">One line. Under two seconds<\u002Fh2>\n          <p style=\"font-size:17px;line-height:1.6;color:#b8c2cc;max-width:58ch;margin:0 auto 40px\">One hotkey opens a single field. Type naturally — heap. parses the deadline, the mention, and the description, in English <em style=\"font-style:normal;color:#e5ecf3\">and<\u002Fem> Russian.<\u002Fp>\n          <div style=\"max-width:680px;margin:0 auto;border:1px solid #262d39;border-radius:12px;background:#11151c;overflow:hidden;text-align:left;box-shadow:0 30px 70px -40px #000\">\n            <div style=\"padding:13px 18px;border-bottom:1px solid #1c2230;font:11px 'JetBrains Mono',monospace;color:#5f6878;display:flex;justify-content:space-between\"><span>quick-capture<\u002Fspan><span>ctrl + shift + space<\u002Fspan><\u002Fdiv>\n            <div style=\"padding:26px 20px;font:17px/1.5 'JetBrains Mono',monospace;color:#e5ecf3\">ship v1 <span style=\"color:#fe9c3a\">tomorrow 14:00<\u002Fspan> <span style=\"color:#3bccdd\">@lena<\u002Fspan> <span style=\"color:#5f6878\">// needs review<\u002Fspan><span style=\"display:inline-block;width:9px;height:21px;background:#3bccdd;vertical-align:-4px;margin-left:3px;animation:blink 1.1s step-end infinite\"><\u002Fspan><\u002Fdiv>\n            <div style=\"padding:18px 20px;border-top:1px solid #1c2230;display:flex;gap:10px;flex-wrap:wrap;align-items:center\">\n              <span style=\"font:11px 'JetBrains Mono';color:#5f6878;margin-right:2px\">parsed →<\u002Fspan>\n              <span style=\"font:11px 'JetBrains Mono',monospace;padding:5px 11px;border:1px solid #3a3320;border-radius:999px;color:#fe9c3a;background:rgba(254,156,58,.08)\">⚑ tomorrow 14:00<\u002Fspan>\n              <span style=\"font:11px 'JetBrains Mono',monospace;padding:5px 11px;border:1px solid #1d3b42;border-radius:999px;color:#3bccdd;background:rgba(59,204,221,.08)\">@lena<\u002Fspan>\n              <span style=\"font:11px 'JetBrains Mono',monospace;padding:5px 11px;border:1px solid #262d39;border-radius:999px;color:#8a94a3\">“needs review”<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:34px;justify-content:center;flex-wrap:wrap;margin:34px 0 0;font:12px 'JetBrains Mono',monospace;color:#5f6878\">\n            <span><span style=\"color:#8a94a3\">созвон 15:00-15:30<\u002Fspan> → meeting<\u002Fspan>\n            <span><span style=\"color:#8a94a3\">focus refactor 10:00<\u002Fspan> → focus block<\u002Fspan>\n            <span><span style=\"color:#8a94a3\">напиши @viktor<\u002Fspan> → contact ping<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ===== feature mosaic (from 1c) ===== -->\n        <div style=\"border-top:1px solid #1c2230;padding:80px 48px\">\n          <p style=\"font:11px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#5f6878;margin:0 0 8px\"><span style=\"color:#3bccdd\">03<\u002Fspan> &nbsp;features<\u002Fp>\n          <h2 style=\"font-family:'IBM Plex Serif',serif;font-weight:400;font-size:44px;letter-spacing:-.01em;margin:0 0 38px\">Boards, calendars, docs, notes<\u002Fh2>\n          <div style=\"display:grid;grid-template-columns:1.5fr 1fr 1fr;grid-auto-rows:minmax(158px,auto);gap:16px\">\n            <div style=\"grid-row:span 2;background:#11151c;border:1px solid #262d39;border-radius:12px;padding:30px;display:flex;flex-direction:column;justify-content:space-between;gap:22px\">\n              <span style=\"font:11px 'JetBrains Mono',monospace;color:#3bccdd\">plan · git-aware<\u002Fspan>\n              <div style=\"display:flex;flex-direction:column;gap:11px\">\n                <div style=\"border:1px solid #222c39;border-radius:9px;background:#0d1218;padding:12px 13px\">\n                  <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:7px\"><span style=\"font:600 10px 'JetBrains Mono';color:#7f8a99\">APP-101<\u002Fspan><span style=\"font:700 9px 'JetBrains Mono';letter-spacing:.04em;padding:1px 5px;border-radius:3px;color:#f2555a;background:rgba(242,85,90,.15)\">P0<\u002Fspan><span style=\"margin-left:auto;font:10px 'JetBrains Mono';color:#3bccdd\">⌥ login-rate-limit<\u002Fspan><\u002Fdiv>\n                  <div style=\"font:500 13px 'IBM Plex Sans';color:#e5ecf3\">Login rate-limit bypass<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:8px;font:10px 'JetBrains Mono';letter-spacing:.04em;color:#5f6878\"><span>current branch<\u002Fspan><span style=\"color:#3bccdd\">→<\u002Fspan><span>matched to card<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div><h4 style=\"font:500 24px 'IBM Plex Sans';margin:0 0 12px;color:#e5ecf3\">Git-aware Kanban<\u002Fh4><p style=\"font-size:14.5px;line-height:1.6;color:#8a94a3;margin:0\">Drag-and-drop columns, P0–P3 priority chips, scheduled-time pills. The active branch is matched to its task and the card is decorated with it — automatically, no manual linking.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#11151c;border:1px solid #262d39;border-radius:12px;padding:26px\"><span style=\"font:11px 'JetBrains Mono',monospace;color:#3bccdd\">time<\u002Fspan><h4 style=\"font:500 19px 'IBM Plex Sans';margin:12px 0 8px;color:#e5ecf3\">Calendar<\u002Fh4><p style=\"font-size:13.5px;line-height:1.55;color:#8a94a3;margin:0\">Timeline, week, month, and a drag-to-create day view with a live now-line.<\u002Fp><\u002Fdiv>\n            <div style=\"background:#11151c;border:1px solid #262d39;border-radius:12px;padding:26px\"><span style=\"font:11px 'JetBrains Mono',monospace;color:#3bccdd\">know<\u002Fspan><h4 style=\"font:500 19px 'IBM Plex Sans';margin:12px 0 8px;color:#e5ecf3\">Docs<\u002Fh4><p style=\"font-size:13.5px;line-height:1.55;color:#8a94a3;margin:0\">Custom sections, syntax-highlighted snippets, contact cards.<\u002Fp><\u002Fdiv>\n            <div style=\"background:#11151c;border:1px solid #262d39;border-radius:12px;padding:26px\"><span style=\"font:11px 'JetBrains Mono',monospace;color:#3bccdd\">know<\u002Fspan><h4 style=\"font:500 19px 'IBM Plex Sans';margin:12px 0 8px;color:#e5ecf3\">Notes<\u002Fh4><p style=\"font-size:13.5px;line-height:1.55;color:#8a94a3;margin:0\">Per-profile markdown with @people / #ticket autocomplete and a query language.<\u002Fp><\u002Fdiv>\n            <div style=\"background:#11151c;border:1px solid #262d39;border-radius:12px;padding:26px\"><span style=\"font:11px 'JetBrains Mono',monospace;color:#3bccdd\">find<\u002Fspan><h4 style=\"font:500 19px 'IBM Plex Sans';margin:12px 0 8px;color:#e5ecf3\">Ctrl+K palette<\u002Fh4><p style=\"font-size:13.5px;line-height:1.55;color:#8a94a3;margin:0\">Full-text search across tasks, docs, snippets &amp; people. Fully rebindable keymap.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ===== integrations (from 1c) ===== -->\n        <div style=\"border-top:1px solid #1c2230;padding:80px 48px;text-align:center\">\n          <p style=\"font:11px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#5f6878;margin:0 0 10px\"><span style=\"color:#3bccdd\">04<\u002Fspan> &nbsp;integrations<\u002Fp>\n          <h2 style=\"font-family:'IBM Plex Serif',serif;font-weight:400;font-size:40px;letter-spacing:-.01em;margin:0 0 14px\">Connected, not locked&nbsp;in<\u002Fh2>\n          <p style=\"font-size:16px;line-height:1.6;color:#b8c2cc;max-width:56ch;margin:0 auto 40px\">Sync issues from 13 trackers — one-click OAuth or a token, credentials kept in the OS keychain, status written back when you move a card. Your data still lives in one local file.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:860px;margin:0 auto\">\n            <span style=\"font:12px 'JetBrains Mono',monospace;padding:10px 17px;border:1px solid #262d39;border-radius:8px;color:#b8c2cc;background:#11151c\">GitHub<\u002Fspan>\n            <span style=\"font:12px 'JetBrains Mono',monospace;padding:10px 17px;border:1px solid #262d39;border-radius:8px;color:#b8c2cc;background:#11151c\">GitLab<\u002Fspan>\n            <span style=\"font:12px 'JetBrains Mono',monospace;padding:10px 17px;border:1px solid #262d39;border-radius:8px;color:#b8c2cc;background:#11151c\">Jira<\u002Fspan>\n            <span style=\"font:12px 'JetBrains Mono',monospace;padding:10px 17px;border:1px solid #262d39;border-radius:8px;color:#b8c2cc;background:#11151c\">Trello<\u002Fspan>\n            <span style=\"font:12px 'JetBrains Mono',monospace;padding:10px 17px;border:1px solid #262d39;border-radius:8px;color:#b8c2cc;background:#11151c\">Gitea<\u002Fspan>\n            <span style=\"font:12px 'JetBrains Mono',monospace;padding:10px 17px;border:1px solid #262d39;border-radius:8px;color:#b8c2cc;background:#11151c\">Forgejo<\u002Fspan>\n            <span style=\"font:12px 'JetBrains Mono',monospace;padding:10px 17px;border:1px solid #262d39;border-radius:8px;color:#b8c2cc;background:#11151c\">Redmine<\u002Fspan>\n            <span style=\"font:12px 'JetBrains Mono',monospace;padding:10px 17px;border:1px solid #262d39;border-radius:8px;color:#b8c2cc;background:#11151c\">Todoist<\u002Fspan>\n            <span style=\"font:12px 'JetBrains Mono',monospace;padding:10px 17px;border:1px solid #262d39;border-radius:8px;color:#b8c2cc;background:#11151c\">Asana<\u002Fspan>\n            <span style=\"font:12px 'JetBrains Mono',monospace;padding:10px 17px;border:1px solid #262d39;border-radius:8px;color:#b8c2cc;background:#11151c\">ClickUp<\u002Fspan>\n            <span style=\"font:12px 'JetBrains Mono',monospace;padding:10px 17px;border:1px solid #262d39;border-radius:8px;color:#b8c2cc;background:#11151c\">Sentry<\u002Fspan>\n            <span style=\"font:12px 'JetBrains Mono',monospace;padding:10px 17px;border:1px solid #262d39;border-radius:8px;color:#b8c2cc;background:#11151c\">Bitbucket<\u002Fspan>\n            <span style=\"font:12px 'JetBrains Mono',monospace;padding:10px 17px;border:1px dashed #262d39;border-radius:8px;color:#5f6878;background:transparent\">+ more<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ===== get it / build ===== -->\n        <div style=\"border-top:1px solid #1c2230;padding:80px 48px\">\n          <p style=\"font:11px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#5f6878;margin:0 0 22px\"><span style=\"color:#3bccdd\">05<\u002Fspan> &nbsp;get it<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:40px 64px;align-items:end;margin-bottom:36px\">\n            <h2 style=\"font-family:'IBM Plex Serif',serif;font-weight:400;font-size:44px;line-height:1.1;letter-spacing:-.01em;margin:0\">Three commands,<br>any platform<\u002Fh2>\n            <div>\n              <p style=\"font-size:16px;line-height:1.65;color:#b8c2cc;margin:0 0 20px\">Prebuilt installers are attached to every <a href=\"https://github.com/sectapunterx/heap/releases\" style=\"color:#b8c2cc;border-bottom:1px solid #262d39\">release<\u002Fa> — a Windows installer + portable zip, a macOS <span style=\"font-family:'JetBrains Mono',monospace;color:#8a94a3\">.dmg<\u002Fspan>, and for Linux an AppImage, a <span style=\"font-family:'JetBrains Mono',monospace;color:#8a94a3\">.deb<\u002Fspan>, or a tarball. Download and run — or build from source: plain CMake, Qt 6.4+ and a C++20 toolchain.<\u002Fp>\n              <div style=\"display:flex;gap:12px\">\n                <a href=\"https://github.com/sectapunterx/heap/releases\" style=\"display:inline-flex;align-items:center;gap:9px;padding:13px 24px;background:#3bccdd;color:#0b0e13;font-weight:600;font-size:14px;border-radius:8px\">Download release <span>↓<\u002Fspan><\u002Fa>\n                <a href=\"https://github.com/sectapunterx/heap\" style=\"display:inline-flex;align-items:center;gap:9px;padding:13px 24px;border:1px solid #262d39;color:#b8c2cc;font-weight:500;font-size:14px;border-radius:8px\">Build from source <span>↗<\u002Fspan><\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px\">\n            <div style=\"background:#11151c;border:1px solid #262d39;border-radius:12px;padding:24px\"><span style=\"font:11px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#3bccdd\">linux · debian / ubuntu<\u002Fspan><h4 style=\"font:500 16px 'IBM Plex Sans';margin:12px 0 0;color:#e5ecf3\">apt + cmake<\u002Fh4><pre style=\"background:#0a0d12;border:1px solid #1c2230;border-radius:8px;padding:14px 15px;font:12px/1.65 'JetBrains Mono',monospace;color:#b8c2cc;overflow:auto;margin:14px 0 0;white-space:pre\">sudo apt install \\\n  qt6-base-dev qt6-declarative-dev \\\n  libqt6svg6-dev cmake g++\ncmake -S . -B build\ncmake --build build -j<\u002Fpre><\u002Fdiv>\n            <div style=\"background:#11151c;border:1px solid #262d39;border-radius:12px;padding:24px\"><span style=\"font:11px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#3bccdd\">macos<\u002Fspan><h4 style=\"font:500 16px 'IBM Plex Sans';margin:12px 0 0;color:#e5ecf3\">brew + cmake<\u002Fh4><pre style=\"background:#0a0d12;border:1px solid #1c2230;border-radius:8px;padding:14px 15px;font:12px/1.65 'JetBrains Mono',monospace;color:#b8c2cc;overflow:auto;margin:14px 0 0;white-space:pre\">brew install qt cmake\n\ncmake -S . -B build \\\n  -DCMAKE_PREFIX_PATH=$(brew --prefix qt)\ncmake --build build -j<\u002Fpre><\u002Fdiv>\n            <div style=\"background:#11151c;border:1px solid #262d39;border-radius:12px;padding:24px\"><span style=\"font:11px 'JetBrains Mono',monospace;letter-spacing:.06em;color:#3bccdd\">windows · scoop<\u002Fspan><h4 style=\"font:500 16px 'IBM Plex Sans';margin:12px 0 0;color:#e5ecf3\">one line<\u002Fh4><pre style=\"background:#0a0d12;border:1px solid #1c2230;border-radius:8px;padding:14px 15px;font:12px/1.65 'JetBrains Mono',monospace;color:#b8c2cc;overflow:auto;margin:14px 0 0;white-space:pre\">scoop bucket add heap \\\n  https://github.com/sectapunterx/heap\nscoop install heap\n\n# or grab the installer / portable zip<\u002Fpre><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ===== footer ===== -->\n        <div style=\"border-top:1px solid #1c2230;padding:40px 48px;display:flex;justify-content:space-between;align-items:center;font:11px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#5f6878\">\n          <span style=\"display:flex;align-items:center;gap:10px\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 32 32\" style=\"display:block\"><rect x=\"5\" y=\"20\" width=\"22\" height=\"4.4\" rx=\"2.2\" fill=\"#c6d0dc\"><\u002Frect><rect x=\"8\" y=\"13.8\" width=\"16\" height=\"4.4\" rx=\"2.2\" fill=\"#c6d0dc\"><\u002Frect><rect x=\"11\" y=\"7.6\" width=\"10\" height=\"4.4\" rx=\"2.2\" fill=\"#e8eef4\"><\u002Frect><\u002Fsvg>heap. · mit · 2026<\u002Fspan>\n          <span>work, in one place.<\u002Fspan>\n        <\u002Fdiv>\n      \n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { view: 'board', pri: [], archived: false, hintDismissed: false };\n  renderVals() {\n    const P0 = { prColor: '#f2555a', prBg: 'rgba(242,85,90,.15)' };\n    const P1 = { prColor: '#fe9c3a', prBg: 'rgba(254,156,58,.14)' };\n    const P2 = { prColor: '#d6b13c', prBg: 'rgba(214,177,60,.14)' };\n    const P3 = { prColor: '#8793a3', prBg: 'rgba(135,147,163,.14)' };\n    const person = '#5f6878';\n    const columns = [\n        { name: 'BACKLOG', dot: '#5f6878', count: 3, cards: [\n          { id: 'APP-113', pr: 'P3', ...P3, title: 'Internal logging impr
